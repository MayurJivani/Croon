# Push to main: build the image, push it to GHCR, deploy it through Coolify straight away.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croon
          POSTGRES_PASSWORD: croon
          POSTGRES_DB: croon
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U croon" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://croon:croon@localhost:5432/croon
      CSRF_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: node apps/server/src/db/migrate.ts && npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mayurjivani/croon:latest,ghcr.io/mayurjivani/croon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # forge.futile.studio sits behind Cloudflare Access, so the call carries a service
      # token too. Access answers a refused token with a redirect, so only 200 counts.
      - name: Deploy
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" "https://forge.futile.studio/api/v1/deploy?uuid=${{ vars.COOLIFY_UUID }}")
          echo "Coolify answered $code"
          [ "$code" = 200 ]
